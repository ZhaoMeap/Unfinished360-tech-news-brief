name: Weekly technology curator

on:
  schedule:
    # UTC Sunday 12:00 = Asia/Taipei Sunday 20:00; scheduling may be delayed.
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      week:
        description: 'Optional ISO week, e.g. 2026-W41'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-curator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests (offline, no email)
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Restore durable daily history (artifact fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python -m scripts.restore_weekly_history
      - name: Generate weekly curator report (no email)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          TARGET_WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$TARGET_WEEK" ]; then
            python -m src.main --weekly --dry-run --week "$TARGET_WEEK"
          else
            python -m src.main --weekly --dry-run
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: reports/weekly/*.md
          name: weekly-tech-report-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
