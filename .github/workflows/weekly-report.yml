name: Weekly technology curator

on:
  schedule:
    # UTC Sunday 12:00 = Asia/Taipei Sunday 20:00; scheduling may be delayed.
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-curator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests (offline, no email)
        run: python -m unittest discover -s tests -v
      - name: Restore last seven days of daily artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_daily_artifacts.py
      - name: Generate weekly curator report (no email)
        run: python -m src.main --weekly --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: reports/weekly/*.md
          name: weekly-tech-report-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
