name: Daily technology brief

on:
  schedule:
    # UTC 01:17/07:17/13:17 = Asia/Taipei 09:17/15:17/21:17.
    # Avoid the top-of-hour peak; GitHub may still delay or drop scheduled runs.
    - cron: '17 1,7,13 * * *'
  workflow_dispatch:
    inputs:
      editor_preview:
        description: 'Generate a fresh editor preview without claiming completed slots'
        type: boolean
        required: false
        default: false
      send_email:
        description: 'Explicitly send this run via SMTP (requires Secrets)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: technology-brief-history
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Offline tests (no email sent)
        run: python -m unittest discover -s tests -v
      - name: Generate dry-run editor report
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.send_email && !inputs.editor_preview) }}
        # Runner calls the existing dry-run/editor renderer; no email transport.
        # Claims and results are fast-forward persisted before/after collection.
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EDITOR_MODEL: ${{ vars.OPENAI_EDITOR_MODEL || 'gpt-4.1-mini' }}
          LOOKBACK_HOURS: '48'
        run: |
          gh auth setup-git --hostname github.com
          python -m scripts.run_daily_slots
      - name: Fresh editor preview (no email, no slot claims)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.editor_preview && !inputs.send_email }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EDITOR_MODEL: ${{ vars.OPENAI_EDITOR_MODEL || 'gpt-4.1-mini' }}
        run: python -m src.main --dry-run --editor
      - name: Explicit email run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.main --send-email
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: technology-brief-${{ github.run_id }}
          path: reports/**/*.md
          if-no-files-found: warn
          retention-days: 7
